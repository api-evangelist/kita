openapi: 3.1.0
info:
  title: Kita AI Underwriter API
  version: v1
  summary: Create loan applications, upload borrower documents, and retrieve a deterministic credit picture and cited credit memo.
  description: |
    The Kita AI Underwriter API turns borrower documents into a decision-ready credit file.
    Create an application, push documents, and poll for extraction, the deterministic credit
    picture (spread, adjustments, policy decision), and a cited credit memo.

    Authentication uses an organization API key prefixed `kita_uw_`, sent as either
    `Authorization: ApiKey <key>` or `Authorization: Bearer <key>`. Two scopes are enforced
    per endpoint: `read` for GET endpoints and `write` for mutations.

    Errors return `{ "message": "..." }` with a standard HTTP status. `POST /intake` is
    idempotent on `external_ref`.

    NOTE: Kita does not publish a machine-readable OpenAPI description. This document was
    generated by the API Evangelist enrichment pipeline from Kita's own published API
    reference (https://www.kita.ai/documentation and the API.md in
    Kita-Technologies/kita-api-examples). Only operations, parameters, fields, and status
    codes that Kita documents are represented here.
  contact:
    name: Kita Support
    email: support@kita.ai
    url: https://www.kita.ai/documentation
  x-source:
  - https://www.kita.ai/documentation
  - https://github.com/Kita-Technologies/kita-api-examples/blob/main/API.md
  x-generated-by: api-evangelist-enrichment-pipeline
  x-generated: '2026-07-19'
servers:
- url: https://underwriter.kita.ai/api/v1
  description: Production
tags:
- name: Applications
  description: Loan application records.
- name: Documents
  description: Borrower document upload and extraction.
- name: Memo
  description: Cited credit memo synthesis and retrieval.
- name: Credit
  description: Deterministic credit picture — spread, adjustments, policy decision.
- name: Exports
  description: PDF and XLSX exports.
- name: Transcripts
  description: Plain-text document transcripts.
- name: Conversation
  description: Borrower message thread.
security:
- ApiKeyAuth: []
paths:
  /intake:
    post:
      tags: [Applications]
      operationId: intakeApplication
      summary: Create an application and upload documents in one call
      description: |
        One-call create plus document upload. Send `multipart/form-data` with an `application`
        field carrying the JSON metadata plus repeated `file`/`files` parts, or
        `application/json` for metadata only. Pass `external_ref` for idempotency — a retried
        push returns the existing application with `"idempotent": true` and HTTP 200 instead
        of creating a duplicate.
      x-scope: write
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                application:
                  type: string
                  description: JSON-encoded application metadata.
                file:
                  type: string
                  format: binary
                files:
                  type: array
                  items:
                    type: string
                    format: binary
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreate'
      responses:
        '201':
          description: Application created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationEnvelope'
        '200':
          description: Idempotent replay — the existing application for this `external_ref`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationEnvelope'
              example:
                data:
                  id: 3f1c9b6e-6b3a-4a1c-9e1f-2f8c1d5a7b90
                  app_id: APP-1234
                  status: awaiting_docs
                  idempotent: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502':
          description: Application created but document upload failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /applications:
    post:
      tags: [Applications]
      operationId: createApplication
      summary: Create an application
      description: Create application metadata only. Documents are uploaded separately.
      x-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreate'
            example:
              business_name: Rivera Auto Repair LLC
              borrower_email: owner@riveraauto.example
              loan_type: sba_7a
              loan_amount: 150000
              borrower_phone: '+15125550142'
              application_context: Use of proceeds
              send_outreach: false
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [Applications]
      operationId: listApplications
      summary: List applications
      description: List applications for the calling organization, with offset pagination.
      x-scope: read
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ApplicationStatus'
      - name: limit
        in: query
        required: false
        description: Page size. Default 50, clamped to 1–200.
        schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      - name: offset
        in: query
        required: false
        schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200':
          description: A page of applications.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Application' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
              example:
                data: []
                pagination: { total: 137, limit: 25, offset: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /applications/{id}:
    parameters:
    - $ref: '#/components/parameters/ApplicationId'
    get:
      tags: [Applications]
      operationId: getApplication
      summary: Get an application
      description: Fetch a single application by UUID or human `app_id`. Includes `document_count`.
      x-scope: read
      responses:
        '200':
          description: The application.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Applications]
      operationId: updateApplication
      summary: Update an application
      description: Update mutable fields — business_name, loan_type, loan_amount, application_context, status.
      x-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Applications]
      operationId: deleteApplication
      summary: Delete an application
      description: Permanently deletes the application, its documents and storage, and the borrower if orphaned.
      x-scope: write
      responses:
        '200':
          description: Deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /applications/{id}/documents:
    parameters:
    - $ref: '#/components/parameters/ApplicationId'
    post:
      tags: [Documents]
      operationId: uploadDocuments
      summary: Upload borrower documents
      description: Upload one or more files as multipart/form-data. Each file's extraction pipeline runs after the response returns.
      x-scope: write
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '201':
          description: Documents accepted for processing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Document' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [Documents]
      operationId: listDocuments
      summary: List documents on an application
      x-scope: read
      parameters:
      - name: include
        in: query
        required: false
        description: Pass `download_url` to add signed download URLs valid for one hour.
        schema: { type: string, enum: [download_url] }
      responses:
        '200':
          description: The documents on this application.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /applications/{id}/documents/{docId}:
    parameters:
    - $ref: '#/components/parameters/ApplicationId'
    - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Documents]
      operationId: getDocument
      summary: Get a document
      description: Returns the document plus the structured `kita_raw` extraction, `recommendations`, and `inconsistencies`.
      x-scope: read
      responses:
        '200':
          description: The document and its extraction.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Documents]
      operationId: deleteDocument
      summary: Delete a document
      description: Deletes the file and recomputes file completeness.
      x-scope: write
      responses:
        '200':
          description: Deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /applications/{id}/documents/{docId}/transcript:
    parameters:
    - $ref: '#/components/parameters/ApplicationId'
    - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Transcripts]
      operationId: getDocumentTranscript
      summary: Get one document's transcript
      x-scope: read
      parameters:
      - name: format
        in: query
        required: false
        schema: { type: string, enum: [txt, json], default: txt }
      responses:
        '200':
          description: The transcript.
          content:
            text/plain:
              schema: { type: string }
            application/json:
              schema:
                type: object
                properties:
                  pages: { type: integer }
                  block_count: { type: integer }
                  char_count: { type: integer }
                  has_text: { type: boolean }
                  text: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /applications/{id}/transcripts:
    parameters:
    - $ref: '#/components/parameters/ApplicationId'
    get:
      tags: [Transcripts]
      operationId: listApplicationTranscripts
      summary: Get transcripts for every document in the file
      x-scope: read
      parameters:
      - name: format
        in: query
        required: false
        schema: { type: string, enum: [json, txt], default: json }
      responses:
        '200':
          description: Transcripts for the application.
          content:
            application/json:
              schema: { type: object }
            text/plain:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /applications/{id}/credit:
    parameters:
    - $ref: '#/components/parameters/ApplicationId'
    get:
      tags: [Credit]
      operationId: getCreditPicture
      summary: Get the deterministic credit picture
      description: |
        Returns the normalized `spread` (adjusted EBITDA/net income, DSCR, margins,
        debt-to-worth, current ratio, reserve months, LTV, sensitivity table, per-metric
        provenance), the `adjustments` line items (tagged `ai` or `lo`), and the policy
        engine `decision` with every rule's pass/fail. Values come from a versioned
        calculation engine, not from an LLM. Layers are null until computed.
      x-scope: read
      responses:
        '200':
          description: The credit picture.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CreditPicture' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /applications/{id}/memo:
    parameters:
    - $ref: '#/components/parameters/ApplicationId'
    post:
      tags: [Memo]
      operationId: synthesizeMemo
      summary: Synthesize the credit memo
      description: Drafts or redrafts the cited credit memo. Runs inline for up to roughly 120 seconds.
      x-scope: write
      responses:
        '200':
          description: Synthesis complete.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, examples: [synthesis_complete] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [Memo]
      operationId: getMemo
      summary: Get the credit memo
      description: Returns memo sections with citations. Bodies are plain text.
      x-scope: read
      responses:
        '200':
          description: The memo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Memo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /applications/{id}/memo/status:
    parameters:
    - $ref: '#/components/parameters/ApplicationId'
    get:
      tags: [Memo]
      operationId: getMemoStatus
      summary: Get memo synthesis status
      description: Poll until `synthesis_in_progress` is false and `is_stale` is false.
      x-scope: read
      responses:
        '200':
          description: Synthesis progress and freshness.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MemoStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /applications/{id}/memo/export:
    parameters:
    - $ref: '#/components/parameters/ApplicationId'
    get:
      tags: [Exports]
      operationId: exportMemo
      summary: Export the credit memo or financial spread
      description: |
        `pdf` (default) returns the credit memo PDF. `xlsx` returns the financial spread
        workbook — income statement, UCA cash flow, DSCR, sensitivity. Returns 404 if no
        spread has been computed yet.
      x-scope: read
      parameters:
      - name: format
        in: query
        required: false
        schema: { type: string, enum: [pdf, xlsx], default: pdf }
      responses:
        '200':
          description: The export file.
          content:
            application/pdf:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /applications/{id}/export:
    parameters:
    - $ref: '#/components/parameters/ApplicationId'
    get:
      tags: [Exports]
      operationId: exportExtractions
      summary: Export the raw field-extractions workbook
      description: Downloads the extraction workbook as .xlsx, one sheet per file area. Distinct from the memo spread export.
      x-scope: read
      parameters:
      - name: format
        in: query
        required: false
        schema: { type: string, enum: [xlsx], default: xlsx }
      responses:
        '200':
          description: The extractions workbook.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /applications/{id}/conversation:
    parameters:
    - $ref: '#/components/parameters/ApplicationId'
    get:
      tags: [Conversation]
      operationId: getConversation
      summary: Get the borrower conversation thread
      description: Returns `conversation_messages`. Pass `after` to fetch only newer messages for incremental sync.
      x-scope: read
      parameters:
      - name: after
        in: query
        required: false
        description: Return only messages with a higher `display_order`.
        schema: { type: integer }
      responses:
        '200':
          description: The conversation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: |
        Organization API key prefixed `kita_uw_`, minted in Settings → API keys and shown once.
        Kita stores only SHA-256 hashes. Both `Authorization: ApiKey <key>` and
        `Authorization: Bearer <key>` are accepted. Keys carry `read` and/or `write` scope;
        a key missing the required scope receives 403.
  parameters:
    ApplicationId:
      name: id
      in: path
      required: true
      description: Application UUID or human `app_id` (e.g. `APP-1234`).
      schema: { type: string }
    DocumentId:
      name: docId
      in: path
      required: true
      description: Document identifier.
      schema: { type: string }
  responses:
    BadRequest:
      description: Malformed body, missing fields, or bad parameters.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, malformed, unknown, or revoked API key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Valid key lacks the required scope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found in this organization.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          description: Human-readable description of the error.
      required: [message]
    Pagination:
      type: object
      properties:
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    ApplicationStatus:
      type: string
      enum: [submitted, awaiting_docs, underwriting, question_raised, memo_drafted, approved, declined]
    DocumentStatus:
      type: string
      enum: [awaiting, processing, verified, low_confidence, missing]
    ApplicationCreate:
      type: object
      required: [business_name, borrower_email, loan_type, loan_amount]
      properties:
        business_name: { type: string, description: Legal business name. }
        borrower_email: { type: string, format: email }
        loan_type: { type: string, description: Must match an org loan product, e.g. `sba_7a`. }
        loan_amount: { type: number, exclusiveMinimum: 0 }
        borrower_phone: { type: string }
        application_context: { type: string, description: Loan purpose or free-text context. }
        external_ref: { type: string, description: Unique loan/record ID. Enables idempotent intake. }
        send_outreach: { type: boolean, default: false, description: Email the borrower for missing documents. }
    ApplicationUpdate:
      type: object
      properties:
        business_name: { type: string }
        loan_type: { type: string }
        loan_amount: { type: number }
        application_context: { type: string }
        status: { $ref: '#/components/schemas/ApplicationStatus' }
    Application:
      type: object
      properties:
        id: { type: string, format: uuid }
        app_id: { type: string, examples: [APP-1234] }
        status: { $ref: '#/components/schemas/ApplicationStatus' }
        file_completeness: { type: number }
        document_count: { type: integer }
        idempotent: { type: boolean, description: Present and true on an idempotent intake replay. }
    ApplicationEnvelope:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Application' }
    Document:
      type: object
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        download_url: { type: string, format: uri, description: Signed URL, valid one hour. Present when `include=download_url`. }
        kita_raw: { type: object, description: Structured extraction output. }
        recommendations: { type: array, items: { type: object } }
        inconsistencies: { type: array, items: { type: object } }
    CreditPicture:
      type: object
      properties:
        spread:
          type: object
          nullable: true
          description: Adjusted EBITDA/net income, normalized ratios, sensitivity table, per-metric provenance.
        adjustments:
          type: array
          nullable: true
          description: Normalization line items, each tagged `ai` or `lo`.
          items: { type: object }
        decision:
          type: object
          nullable: true
          description: Policy engine routing recommendation, auto-route flag, per-rule pass/fail with observed vs expected.
    Memo:
      type: object
      properties:
        last_synthesis_at: { type: string, format: date-time }
        sections:
          type: array
          items:
            type: object
            properties:
              section_number: { type: integer }
              title: { type: string }
              body: { type: string }
              locked_by_lo: { type: boolean }
              updated_at: { type: string, format: date-time }
    MemoStatus:
      type: object
      properties:
        synthesis_in_progress: { type: boolean }
        is_stale: { type: boolean }
        stale_reasons: { type: array, items: { type: string } }
        new_doc_count: { type: integer }
        new_message_count: { type: integer }
        last_run_status: { type: string, enum: [completed, failed] }
        last_synthesis_at: { type: string, format: date-time }
