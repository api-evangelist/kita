openapi: 3.1.0
info:
  title: Kita Capture API
  version: v1
  summary: Document intelligence — extract structured, validated, fraud-checked data from bank statements, payslips, IDs, credit reports and 30+ other document types.
  description: |
    Kita Capture turns scanned or photographed financial and identity documents into clean
    JSON — transactions, metadata, metrics, and fraud signals. Upload a file (multipart or
    base64), submit a URL, or batch up to 100 documents, then poll for results or receive an
    HMAC-signed webhook.

    Authentication uses an organization API key prefixed `kita_prod_` sent as
    `Authorization: Bearer <key>`. Errors return `{ "error": ..., "message": ... }`.
    Rate limiting is per organization; 429 responses carry a `Retry-After` header.

    NOTE: Kita does not publish a machine-readable OpenAPI description. This document was
    generated by the API Evangelist enrichment pipeline from Kita's own published API
    documentation (shipped verbatim inside the official `kita-docs-mcp` npm package and
    served at https://www.kita.ai/documentation). Only operations, parameters, fields and
    status codes that Kita documents are represented here.
  contact:
    name: Kita Support
    email: support@kita.ai
    url: https://www.kita.ai/documentation
  x-source:
  - https://www.kita.ai/documentation
  - https://unpkg.com/kita-docs-mcp@0.4.0/docs/Documentation.md
  x-generated-by: api-evangelist-enrichment-pipeline
  x-generated: '2026-07-19'
servers:
- url: https://portal.usekita.com
  description: Production (default; override with the KITA_API_URL environment variable)
tags:
- name: Processing
  description: Submit documents for extraction.
- name: Results
  description: Retrieve extraction results, summaries and exports.
- name: Batch
  description: Process up to 100 documents from URLs in one request.
- name: Verification
  description: Cross-document verification checks.
- name: Webhooks
  description: Register and manage HMAC-signed outbound webhooks.
- name: Folders
  description: Group documents into containers.
- name: Schemas
  description: Custom extraction schemas.
security:
- BearerAuth: []
paths:
  /api/process-async:
    post:
      tags: [Processing]
      operationId: processDocumentAsync
      summary: Submit a document for extraction
      description: |
        Accepts two upload modes on the same URL. Multipart sends the raw `file` plus a
        `document_type`. JSON sends `file_base64` (a data-URI prefix is accepted and stripped)
        plus `filename` and `document_type`. Returns a `documentId` to poll. An optional
        one-shot `webhook_url` delivers the result instead of polling.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, document_type]
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF, PNG, JPG, TIFF or BMP.
                document_type: { $ref: '#/components/schemas/DocumentType' }
                password: { type: string, description: PDF password if the file is encrypted. }
                webhook_url: { type: string, format: uri, description: One-shot delivery URL for this upload. }
          application/json:
            schema:
              type: object
              required: [file_base64, filename, document_type]
              properties:
                file_base64:
                  type: string
                  description: Base64-encoded file contents. A `data:` URI prefix is accepted and stripped automatically.
                filename:
                  type: string
                  description: Filename with extension; the extension drives file-type validation.
                document_type: { $ref: '#/components/schemas/DocumentType' }
                password: { type: string }
                webhook_url: { type: string, format: uri }
            example:
              file_base64: JVBERi0xLjQg...
              filename: statement.pdf
              document_type: bank_statement
      responses:
        '200':
          description: Document queued for processing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessAccepted' }
              example:
                documentId: 12345
                status: pending
                message: Document queued for processing
        '202':
          description: Accepted — poll for results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/results/{documentId}:
    parameters:
    - name: documentId
      in: path
      required: true
      schema: { type: integer }
    get:
      tags: [Results]
      operationId: getDocumentResult
      summary: Get the extraction result
      description: Retrieve the full processed result. Poll until `status` is `completed`.
      responses:
        '200':
          description: The extraction result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentResult' }
              example:
                status: completed
                document_type: bank_statement
                document_id: 123
                metadata:
                  account_holder_name: Juan Dela Cruz
                  account_number: '1234567890'
                  financial_institution: BDO
                  statement_start_date: 01-01-2024
                  statement_end_date: 01-31-2024
                  currency: PHP
                  opening_balance: 50000.0
                  closing_balance: 62000.0
                extracted_data:
                  transactions:
                  - date: 01-02-2024
                    description: SALARY CREDIT
                    credit: 30000.0
                    debit: null
                    balance: 80000.0
                    category: income
                    subcategory: salary
                    transaction_type: credit
                  metrics:
                    total_inflow: 45000.0
                    total_outflow: 33000.0
                    net_cash_flow: 12000.0
                    average_balance: 58000.0
                    total_transactions: 25
                fraud_detection:
                  risk_level: low
                  authenticity_score: 92
                  signals:
                  - severity: info
                    category: document_integrity
                    message: Document appears authentic
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/documents/{id}/summary:
    parameters:
    - $ref: '#/components/parameters/DocumentIdPath'
    get:
      tags: [Results]
      operationId: getDocumentSummary
      summary: Get key metrics for a bank statement or passbook
      description: Account info, flows, balances and category breakdowns. No transaction-level data.
      parameters:
      - name: format
        in: query
        required: false
        schema: { type: string, enum: [json, csv], default: json }
      responses:
        '200':
          description: The summary.
          content:
            application/json:
              schema: { type: object }
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/documents:
    get:
      tags: [Results]
      operationId: listDocuments
      summary: List processed documents
      description: List all processed documents for the organization, with offset pagination and filters.
      parameters:
      - name: limit
        in: query
        required: false
        schema: { type: integer, default: 100 }
      - name: offset
        in: query
        required: false
        schema: { type: integer, default: 0 }
      - name: status
        in: query
        required: false
        schema: { $ref: '#/components/schemas/JobStatus' }
      - name: document_type
        in: query
        required: false
        schema: { $ref: '#/components/schemas/DocumentType' }
      responses:
        '200':
          description: A page of documents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/documents/{id}/export:
    parameters:
    - $ref: '#/components/parameters/DocumentIdPath'
    get:
      tags: [Results]
      operationId: exportDocument
      summary: Download the schema-driven Excel export
      description: Multi-sheet Excel for schema-based types — `audited_financial_statement` (17-sheet workbook), `credit_report`, `slik` and others.
      responses:
        '200':
          description: The workbook.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/documents/{id}/custom-export:
    parameters:
    - $ref: '#/components/parameters/DocumentIdPath'
    get:
      tags: [Results]
      operationId: customExportDocument
      summary: Download the organization's configured Excel export
      description: Works for all document types where the organization has a custom export schema enabled.
      responses:
        '200':
          description: The workbook.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/documents/jobs/{documentId}:
    parameters:
    - name: documentId
      in: path
      required: true
      schema: { type: integer }
    get:
      tags: [Results]
      operationId: getDocumentJob
      summary: Get the processing job for a document
      description: Surfaces per-document cost reporting — `total_cost_usd` and the `cost_report` per-call breakdown (model, prompt/completion tokens, USD per call, stage).
      responses:
        '200':
          description: The job record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_cost_usd: { type: number }
                  cost_report: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/batch:
    post:
      tags: [Batch]
      operationId: createBatch
      summary: Process documents from URLs
      description: Submit up to 100 documents by URL in a single request. Each entry requires `file_url` and `document_type`; optional `filename` overrides auto-detection. Batch processing requires a paid plan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documents]
              properties:
                documents:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [file_url, document_type]
                    properties:
                      file_url: { type: string, format: uri }
                      document_type: { $ref: '#/components/schemas/DocumentType' }
                      filename: { type: string }
                webhook_url: { type: string, format: uri, description: One-shot delivery URL for this batch. }
            example:
              documents:
              - file_url: https://example.com/statement.pdf
                document_type: bank_statement
      responses:
        '200':
          description: Batch created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Batch' }
              example:
                batch_id: batch_abc123
                status: processing
                total_documents: 1
                status_url: /api/v1/batch/batch_abc123
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/batch/{batchId}:
    parameters:
    - $ref: '#/components/parameters/BatchId'
    get:
      tags: [Batch]
      operationId: getBatch
      summary: Get batch status
      responses:
        '200':
          description: Batch progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Batch' }
              example:
                batch_id: batch_abc123
                status: processing
                total_documents: 3
                completed: 2
                failed: 0
                progress_percent: 66.67
                documents:
                - document_id: 100
                  filename: stmt1.pdf
                  status: completed
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/batch/{batchId}/results:
    parameters:
    - $ref: '#/components/parameters/BatchId'
    get:
      tags: [Batch]
      operationId: getBatchResults
      summary: Get results for every document in a batch
      responses:
        '200':
          description: Full extracted data for each document in the batch.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/verify:
    post:
      tags: [Verification]
      operationId: verifyDocuments
      summary: Run cross-document verification
      description: Runs 34+ cross-document checks over documents already processed — e.g. confirming a payslip, bank statement and ID belong to the same applicant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_ids]
              properties:
                document_ids:
                  type: array
                  minItems: 2
                  maxItems: 50
                  items: { type: integer }
                  description: 2–50 document IDs that are already `completed` and belong to the calling organization.
            example:
              document_ids: [101, 102, 103]
      responses:
        '200':
          description: Verification result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  document_count: { type: integer }
                  documents: { type: array, items: { type: object } }
                  document_summary: { type: object }
                  cross_doc_score: { type: number }
                  signals: { type: array, items: { type: object } }
                  field_verifiability: { type: object }
                  corroboration: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/verify/single:
    post:
      tags: [Verification]
      operationId: verifySingleDocument
      summary: Get the full fraud-detection block for one document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                document_id: { type: integer }
      responses:
        '200':
          description: The fraud_detection block.
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/webhooks:
    post:
      tags: [Webhooks]
      operationId: createWebhook
      summary: Register a webhook endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookCreate' }
      responses:
        '200':
          description: Webhook registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [Webhooks]
      operationId: listWebhooks
      summary: List registered webhooks
      responses:
        '200':
          description: The registered webhooks.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Webhook' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/webhooks/{webhookId}:
    parameters:
    - $ref: '#/components/parameters/WebhookId'
    get:
      tags: [Webhooks]
      operationId: getWebhook
      summary: Get a single webhook
      responses:
        '200':
          description: The webhook.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Webhooks]
      operationId: updateWebhook
      summary: Update a webhook
      description: Update the URL, subscribed events, or active flag.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookCreate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Webhooks]
      operationId: deleteWebhook
      summary: Delete a webhook
      responses:
        '200':
          description: Deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/webhooks/{webhookId}/test:
    parameters:
    - $ref: '#/components/parameters/WebhookId'
    post:
      tags: [Webhooks]
      operationId: testWebhook
      summary: Send a test delivery
      responses:
        '200':
          description: Test delivery sent.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/webhooks/{webhookId}/rotate-secret:
    parameters:
    - $ref: '#/components/parameters/WebhookId'
    post:
      tags: [Webhooks]
      operationId: rotateWebhookSecret
      summary: Rotate the signing secret
      responses:
        '200':
          description: The new signing secret.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/webhooks/{webhookId}/secret:
    parameters:
    - $ref: '#/components/parameters/WebhookId'
    get:
      tags: [Webhooks]
      operationId: getWebhookSecret
      summary: Retrieve the current signing secret
      responses:
        '200':
          description: The signing secret.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/webhooks/{webhookId}/deliveries:
    parameters:
    - $ref: '#/components/parameters/WebhookId'
    get:
      tags: [Webhooks]
      operationId: listWebhookDeliveries
      summary: Get delivery history
      description: Delivery status, attempts and latency.
      responses:
        '200':
          description: Delivery history.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/webhooks/stats:
    get:
      tags: [Webhooks]
      operationId: getWebhookStats
      summary: Get delivery aggregates
      responses:
        '200':
          description: Aggregate delivery statistics.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/webhooks/dlq:
    get:
      tags: [Webhooks]
      operationId: getWebhookDeadLetterQueue
      summary: Get the dead-letter queue
      description: Deliveries that failed every retry.
      responses:
        '200':
          description: Dead-lettered deliveries.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/webhooks/validate-url:
    post:
      tags: [Webhooks]
      operationId: validateWebhookUrl
      summary: Pre-flight check a candidate webhook URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, format: uri }
      responses:
        '200':
          description: Validation result.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/webhooks/verify-signature:
    post:
      tags: [Webhooks]
      operationId: verifyWebhookSignature
      summary: Verify a sample payload signature
      description: Helper that checks an `X-Kita-Signature` value against a sample body.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Verification result.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/folders:
    post:
      tags: [Folders]
      operationId: createFolder
      summary: Create a folder
      description: Folders are containers for grouping documents, e.g. by applicant.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Folder created.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [Folders]
      operationId: listFolders
      summary: List folders
      responses:
        '200':
          description: The folders.
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/folders/{folderId}/documents:
    parameters:
    - name: folderId
      in: path
      required: true
      schema: { type: string }
    get:
      tags: [Folders]
      operationId: listFolderDocuments
      summary: List documents in a folder
      responses:
        '200':
          description: Documents in the folder.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/schemas:
    get:
      tags: [Schemas]
      operationId: listSchemas
      summary: List custom extraction schemas
      responses:
        '200':
          description: The schemas.
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Schemas]
      operationId: createSchema
      summary: Create a custom extraction schema
      description: Enterprise organizations can define custom extraction shapes that override the default vocabulary output.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Schema created.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/schemas/{schemaId}:
    parameters:
    - name: schemaId
      in: path
      required: true
      schema: { type: string }
    get:
      tags: [Schemas]
      operationId: getSchema
      summary: Fetch a single schema
      responses:
        '200':
          description: The schema.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Schemas]
      operationId: updateSchema
      summary: Update a schema
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Updated.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Schemas]
      operationId: deleteSchema
      summary: Delete a schema
      responses:
        '200':
          description: Deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Organization API key prefixed `kita_prod_`, issued from the Kita dashboard at
        https://portal.usekita.com and sent as `Authorization: Bearer <key>`.
  parameters:
    DocumentIdPath:
      name: id
      in: path
      required: true
      schema: { type: integer }
    BatchId:
      name: batchId
      in: path
      required: true
      schema: { type: string, examples: [batch_abc123] }
    WebhookId:
      name: webhookId
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Bad request — check the request body and parameters.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: Bad Request
            message: documents array is required and must not be empty
    Unauthorized:
      description: Invalid or missing API key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Upgrade required, or the document type is not enabled for this organization.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Document or batch ID does not exist.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Rate limited. Wait and retry; check the `Retry-After` header.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServerError:
      description: Server error — retry after a brief delay.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string, description: Short error label. }
        message: { type: string, description: Human-readable description. }
    JobStatus:
      type: string
      enum: [pending, processing, completed, failed]
    DocumentType:
      type: string
      description: |
        Document type slug. Case-insensitive. Three types run the legacy stage-config pipeline
        (`bank_statement`, `audited_financial_statement`, `general_information_sheet`); the rest
        run the universal vocabulary-driven pipeline. Slugs without a dedicated vocabulary fall
        back to the `other_document` extractor.
      enum:
      - bank_statement
      - audited_financial_statement
      - general_information_sheet
      - bank_certificate
      - credit_card_statement
      - loan_statement
      - mobile_banking_screenshot
      - passbook
      - payslip
      - business_financials
      - bill
      - receipt
      - remittance_slip
      - sales_invoice
      - government_id
      - certificate_of_employment
      - barangay_clearance
      - credit_report
      - slik
      - acta_constitutiva
      - mx_legal
      - indo_legal
      - combined_document
      - other_document
      - bir_2303
      - bir_2307
      - tin_id
      - secretarys_certificate
      - business_registration_dti
      - business_registration_sec
      - certificate_of_incorporation
      - business_permit
      - mayors_permit
      - purchase_order
      - bill_of_lading
      - proof_of_billing
      - land_title
      - vehicle_registration
      - insurance_policy
      - loan_agreement
      - income_tax_return
    ProcessAccepted:
      type: object
      properties:
        documentId: { type: integer }
        status: { $ref: '#/components/schemas/JobStatus' }
        message: { type: string }
    DocumentResult:
      type: object
      description: Shared envelope for every document type.
      properties:
        status: { $ref: '#/components/schemas/JobStatus' }
        document_type: { $ref: '#/components/schemas/DocumentType' }
        document_id: { type: integer }
        filename: { type: string }
        processing_time_seconds: { type: number }
        uploaded_at: { type: string, format: date-time }
        metadata:
          type: object
          description: Document-level info — account holder, dates, institution.
        extracted_data:
          type: object
          description: Type-specific extracted content.
        fraud_detection:
          $ref: '#/components/schemas/FraudDetection'
    FraudDetection:
      type: object
      description: Fraud and authenticity signals. Present only when data exists.
      properties:
        risk_level: { type: string, examples: [low] }
        authenticity_score: { type: number }
        signals:
          type: array
          items:
            type: object
            properties:
              severity: { type: string }
              category: { type: string }
              message: { type: string }
    Batch:
      type: object
      properties:
        batch_id: { type: string }
        status: { type: string }
        total_documents: { type: integer }
        completed: { type: integer }
        failed: { type: integer }
        progress_percent: { type: number }
        status_url: { type: string }
        documents:
          type: array
          items:
            type: object
            properties:
              document_id: { type: integer }
              filename: { type: string }
              status: { $ref: '#/components/schemas/JobStatus' }
    WebhookCreate:
      type: object
      properties:
        url: { type: string, format: uri }
        events: { type: array, items: { type: string } }
        active: { type: boolean }
    Webhook:
      type: object
      properties:
        id: { type: string }
        url: { type: string, format: uri }
        events: { type: array, items: { type: string } }
        active: { type: boolean }
