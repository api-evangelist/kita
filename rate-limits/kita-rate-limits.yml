generated: '2026-07-19'
method: searched
source: https://www.kita.ai/documentation
summary: 'Kita enforces per-organization rate limiting on the Capture API and signals it with
  HTTP 429 plus a Retry-After header, but does not publish numeric request-per-second or
  request-per-minute ceilings. Concrete published constraints are the batch size cap and
  plan-derived limits.'
rate_limits:
- api: Kita Capture API
  scope: per organization
  enforced: true
  signal:
    status: 429
    headers:
    - name: Retry-After
      description: Seconds to wait before retrying.
  limit_count: null
  limit_window: null
  published_numbers: false
  guidance: Wait for the Retry-After interval and retry.
- api: Kita AI Underwriter API
  scope: per organization
  enforced: not documented
  signal: none documented
  limit_count: null
  limit_window: null
  published_numbers: false
  guidance: 'Kita advises running document pushes at reasonable concurrency and polling on
    backoff — every few seconds, not a tight loop — starting at 2–3 seconds with exponential
    backoff. Heavy programmatic load should be coordinated with your Kita contact.'
constraints:
- name: Maximum batch size
  api: Kita Capture API
  value: 100
  unit: documents per request
  endpoint: POST /api/v1/batch
- name: Maximum documents per verification request
  api: Kita Capture API
  value: 50
  unit: document IDs per request
  minimum: 2
  endpoint: POST /api/v1/verify
- name: Maximum file size
  api: Kita Capture API
  value: plan-determined
  published: false
- name: Batch processing entitlement
  api: Kita Capture API
  value: requires a paid plan
- name: Signed download URL lifetime
  api: Kita AI Underwriter API
  value: 1
  unit: hour
  endpoint: GET /applications/{id}/documents?include=download_url
- name: Memo synthesis inline execution ceiling
  api: Kita AI Underwriter API
  value: ~120
  unit: seconds
  endpoint: POST /applications/{id}/memo
quota_model:
  unit: credits
