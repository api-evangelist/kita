notes: 'No first-party client library was found on Maven Central, NuGet, pkg.go.dev,
  RubyGems, Packagist or crates.io. For languages other than Python, Kita documents calling
  the REST API directly and ships example programs for cURL, JavaScript (Node 18+), PHP 7.4+,
  Java 11+ and C# (.NET 6+) — see examples/kita-examples.yml. The Kita AI Underwriter API has
