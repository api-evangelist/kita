aid: kita
name: Kita
description: 'Kita is an AI-native loan origination and underwriting company (Y Combinator
  W26, San Francisco) building document intelligence and credit decisioning for lenders in
  emerging and undertapped markets. Kita ships two developer-facing APIs. Kita Capture is a
  document-intelligence API that turns scanned or photographed bank statements, payslips,
  government IDs, credit reports, tax filings and 30+ other document types into structured,
  validated, fraud-checked JSON, with cross-document verification, batch processing, custom
  extraction schemas and HMAC-signed webhooks. Kita Underwriter is a credit-file API that
  creates loan applications, ingests borrower documents, computes a deterministic credit
  picture (adjusted EBITDA, DSCR, margins, debt-to-worth, sensitivity and a policy-engine
  decision produced by a versioned calculation engine rather than an LLM) and synthesizes a
  cited credit memo. The platform is region-pinned across Singapore and Mexico deployments
  and is used by microfinance institutions, SME lenders, CDFIs and community banks across
  Southeast Asia, Latin America and the United States.'
